name: Build Quartz theme

on:
  push:
    branches: [v5]
    paths:
      - "theme/src/**"
      - "theme/tenebrous.css"
      - ".github/workflows/theme-build.yaml"
  pull_request:
    paths:
      - "theme/src/**"
      - "theme/tenebrous.css"
      - ".github/workflows/theme-build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared Obsidian theme
        uses: actions/checkout@v7
        with:
          repository: sigrunixia/Tenebrous-Obsidian
          path: obsidian

      - name: Install dart-sass
        env:
          SASS_VERSION: "1.102.0"
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Build tenebrous.css
        run: sass --no-source-map --charset --load-path=obsidian/src theme/src/main.scss theme/tenebrous.css

      - name: Verify tenebrous.css is up to date
        run: |
          if ! git diff --exit-code theme/tenebrous.css; then
            echo "::error::theme/tenebrous.css is out of date. Run ./build.sh and commit the result."
            exit 1
          fi
