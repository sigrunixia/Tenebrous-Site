name: Release Quartz theme

# Push a tag like theme-1.0.0 and this makes a draft release. The tag is the
# version. Publish the draft by hand once the notes look right.
on:
  push:
    tags:
      - "theme-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared Obsidian theme
        uses: actions/checkout@v7
        with:
          repository: sigrunixia/Tenebrous-Obsidian
          path: obsidian

      - name: Install dart-sass
        env:
          SASS_VERSION: "1.102.0"
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Build tenebrous.css
        run: sass --no-source-map --charset --load-path=obsidian/src theme/src/main.scss theme/tenebrous.css

      - name: Verify tenebrous.css is up to date
        run: |
          if ! git diff --exit-code theme/tenebrous.css; then
            echo "::error::theme/tenebrous.css is out of date. Run ./build.sh, commit, and tag again."
            exit 1
          fi

      - name: Pack the theme
        run: |
          mkdir -p dist/tenebrous-quartz
          cp theme/tenebrous.css theme/THEME.md dist/tenebrous-quartz/
          cp -R theme/assets dist/tenebrous-quartz/assets
          (cd dist && zip -qr tenebrous-quartz.zip tenebrous-quartz)
          cp theme/tenebrous.css dist/tenebrous.css

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/tenebrous.css dist/tenebrous-quartz.zip \
            --draft --generate-notes --latest=false \
            --title "Tenebrous for Quartz ${TAG#theme-}"
